<html>
<head>
	<title>FLAC Encoder</title>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
</head>

<body>
	<div id="body-content">
		<h1>FLAC Encoder</h1>
		<progress style="display: inline-block; text-align: center; width: 100%;" value="0" max="100">Your browser does not support this tool. Upgrade to a modern browser, please.</progress>
		<input id="com-file-analyzer-fileinput" autofocus="" type="file" />
		<ul id="results"></ul>
		<pre id="console"></pre>

		<script>
			var progress = document.querySelector('progress'),
				consoleOutput = document.getElementById('console'),
				results = document.getElementById('results'),
				input = document.getElementById('com-file-analyzer-fileinput'),
				// Create a new web worker
				// A worker can process multiple files one after another
				worker = new Worker('worker/EmsWorkerProxy.js');

			// flac overwrites its progress output using backspaces
			function appendToConsole(text) {
				var chars = consoleOutput.textContent.split(''),
					i;
				for (i = 0; i < text.length; i++) {
					if (text[i] === '\b') {
						chars.pop();
					} else {
						chars.push(text[i]);
					}
				}
				consoleOutput.textContent = chars.join('');
			}

			// Download and compile the encoder while the user picks a file
			worker.postMessage({ command: 'prefetch' });

			// When the input's value changed, the user most likely
			// inserted a file
			input.addEventListener('change', function() {
				// Get the file supplied by the user
				var f = input.files[0];
				if (!f) {
					return;
				}

				// Disable input to prevent the user
				// from inserting another file
				input.disabled = true;

				// FLAC input files are decoded, everything else is encoded
				var decode = /\.(flac|oga|ogg)$/i.test(f.name),
					outName = f.name.replace(/\.[^.]+$/, '') + (decode ? '.wav' : '.flac');

				// Command line arguments
				// These are strings such as
				// options, input file and output file
				var args = decode ? ['-d', f.name, '-o', outName] : [f.name, '-o', outName];
				// Input file data
				// Object literal mapping
				// file names to Uint8Array or Blob/File
				// Files are read on demand by the worker, so
				// even large files don't need to fit into memory
				var inData = {};
				inData[f.name] = f;

				// Meta-information about the files
				// that are being created during encoding
				// Currently MIME type only
				var outData = {};
				outData[outName] = {
					// Its MIME type
					'MIME': decode ? 'audio/wav' : 'audio/flac'
				};

				// Finally post all the data to the
				// worker together with the "encode"
				// command.
				worker.postMessage({
					command: 'encode',
					args: args,
					outData: outData,
					fileData: inData
				});
			});

			// Listen for messages by the worker
			worker.onmessage = function(e) {
				var reply = e.data && e.data.reply,
					vals = e.data && e.data.values,
					fileName, link, item;

				if (reply === 'progress') {
					// vals: [samples processed, total samples, bytes written]
					if (vals[1]) {
						// ... push the progress bar forward
						progress.value = vals[0] / vals[1] * 100;
					}
				} else if (reply === 'log' || reply === 'err') {
					appendToConsole(vals.join(' ') + '\n');
				} else if (reply === 'done') {
					progress.value = 100;
					for (fileName in vals) {
						// ... offer all files the worker returned
						// In this case it's only one because we didn't
						// use a command line argument that would force
						// flac.js to create another file
						link = document.createElement('a');
						link.textContent = fileName;
						link.download = fileName;
						link.href = URL.createObjectURL(vals[fileName].blob);
						item = document.createElement('li');
						item.appendChild(link);
						results.appendChild(item);
					}
					input.disabled = false;
				} else if (reply === 'failed') {
					appendToConsole('flac exited with code ' + e.data.exitCode + '\n');
					input.disabled = false;
				}
			};
		</script>
	</div>
</body>

</html>
